# GitOps / Portainer 专用 compose：
# - 直接从 GitHub 仓库 build，无需上传 zip；
# - 所有密钥通过“部署环境变量”注入（Portainer 表单 / 服务器 .env / export），
#   仓库中只放 .env.example，绝不提交真实密钥；
# - 必填项用 ${VAR:?} 校验，漏填会直接报错而不是带空值启动。
#
# Portainer：Stacks -> Add stack -> Git repository，Compose path 填
#            ./docker-compose.git.yml，并在 Environment variables 表单填下面变量。
# 命令行：在服务器仓库根目录准备 .env 后执行
#        docker compose -f docker-compose.git.yml up -d --build

services:
  ragflow-auth-proxy:
    build:
      context: .
      args:
        # 国内 build 加速，可选：https://mirrors.aliyun.com/pypi/simple/
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    image: ragflow-auth-proxy:git
    container_name: ragflow-auth-proxy
    restart: unless-stopped
    ports:
      - "${PUBLISH_PORT:-8000}:8000"
    environment:
      # ---- 必填 ----
      RAGFLOW_API_KEY: ${RAGFLOW_API_KEY:?请在部署环境设置 RAGFLOW_API_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?请在部署环境设置 ADMIN_TOKEN}
      # ---- 可选（均有默认值）----
      RAGFLOW_BASE_URL: ${RAGFLOW_BASE_URL:-http://host.docker.internal:9380}
      RAGFLOW_TIMEOUT_SECONDS: ${RAGFLOW_TIMEOUT_SECONDS:-120}
      ADMIN_TOKEN_FILE: /data/admin_token.txt
      DATABASE_URL: sqlite:////data/proxy.db
      STRICT_RESOURCE_BINDING: ${STRICT_RESOURCE_BINDING:-true}
      BINDING_CACHE_TTL: ${BINDING_CACHE_TTL:-300}
      DEFAULT_RATE_LIMIT_PER_MIN: ${DEFAULT_RATE_LIMIT_PER_MIN:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - ragflow_auth_data:/data
    # RAGFlow 在宿主机时用 http://host.docker.internal:9380；
    # 若 RAGFlow 在其它容器/主机，删掉此项并把 RAGFLOW_BASE_URL 改为对应地址。
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  ragflow_auth_data:
